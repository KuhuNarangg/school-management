version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: northstar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: northstar_school
    ports:
      - '5432:5432'
    volumes:
      - northstar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d northstar_school']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  northstar_pgdata:
